# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "4b801c061ddebf1283a79da79315051e"
name = "itsmadeleine.love"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[events]
api_version = "2026-10"

  [[events.subscription]]
  handle = "commande-qr-retrait"
  topic = "Order"
  actions = [ "create", "update" ]
  triggers = [ "order.displayFinancialStatus", "order.cancellation" ]
  uri = "https://backoffice.itsmadeleine.shop/webhooks/shopify/order-paid"
  query = """
query commande_qr($orderId: ID!) {
  order(id: $orderId) {
    legacyResourceId
    name
    email
    statusPageUrl
    displayFinancialStatus
    cancelledAt
    lineItems(first: 25) {
      nodes { product { tags } }
    }
  }
}
"""

[webhooks]
api_version = "2027-01"

[build]
automatically_update_urls_on_dev = true
