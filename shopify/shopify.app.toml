# Configuration de l'app Shopify (jalon M0). Seul fichier de config de l'app :
# déployer avec `pnpm app:deploy --config shopify.app.toml`.
# Référence : roadmap/M0-prerequis.md
#
# `shopify app config link` crée un nouveau fichier sans [events] : ne pas le
# déployer, recopier son client_id ici puis le supprimer.

# App de l'organisation du client (créée le 14/11).
client_id = "a977545e9444eb4c8d30c169b1ed4c6d"
name = "itsmadeleine.app"
application_url = "https://backoffice.itsmadeleine.shop"
embedded = false

[access_scopes]
# read_orders : sujet Order des Events. read_products : tags des produits des lignes.
scopes = "read_orders,read_products"

[auth]
redirect_urls = ["https://backoffice.itsmadeleine.shop/auth/callback"]

[events]
api_version = "2026-10"

[[events.subscription]]
handle = "commande-qr-retrait"
topic = "Order"
actions = ["create", "update"]
# Noms validés par Shopify au deploy du 14/11 (liste dans M0, « Résultats »).
# displayFinancialStatus couvre PAID, REFUNDED et PARTIALLY_REFUNDED.
triggers = ["order.displayFinancialStatus", "order.cancellation"]
uri = "https://backoffice.itsmadeleine.shop/webhooks/shopify/order-paid"
# Pas de query_filter : l'API décide selon l'état renvoyé (M3).
query = """
query commande_qr($orderId: ID!) {
  order(id: $orderId) {
    legacyResourceId
    name
    email
    statusPageUrl
    displayFinancialStatus
    cancelledAt
    lineItems(first: 25) {
      nodes { product { tags } }
    }
  }
}
"""

[webhooks]
api_version = "2027-01"

[build]
include_config_on_deploy = true
# Ne jamais laisser `shopify app dev` remplacer les URL de production.
automatically_update_urls_on_dev = false
